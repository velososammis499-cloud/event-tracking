<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>供应链Agent · 采购价插件</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#f5f6fa; color:#1f2329; display:flex; height:100vh; overflow:hidden; }

/* 左侧导航 */
.sidebar { width:250px; background:#fff; border-right:1px solid #eceef1; display:flex; flex-direction:column; flex-shrink:0; padding:18px 14px; }
.brand { display:flex; align-items:center; gap:10px; padding:4px 6px 18px; }
.brand-logo { width:32px; height:32px; border-radius:9px; background:linear-gradient(135deg,#ff4d4f,#e01c1c); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:800; font-size:12px; line-height:1; }
.brand-logo small { font-size:5px; margin-top:1px; letter-spacing:1px; }
.brand-title { font-size:17px; font-weight:700; }
.brand-icons { margin-left:auto; display:flex; gap:9px; color:#8a9099; font-size:15px; }
.collab-btn { border:1px solid #e3e6eb; border-radius:10px; padding:10px; text-align:center; color:#6b46f5; font-weight:600; font-size:14px; margin-bottom:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }
.collab-btn:hover { background:#f8f7ff; }
.nav-item { display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:10px; cursor:pointer; font-size:15px; color:#3d424b; margin-bottom:2px; }
.nav-item .ico { font-size:15px; width:18px; text-align:center; }
.nav-item:hover { background:#f5f6fa; }
.nav-divider { height:1px; background:#eceef1; margin:14px 6px; }
.recent-head { display:flex; align-items:center; font-weight:700; font-size:15px; padding:0 8px 6px; }
.recent-head .caret { margin-left:6px; color:#8a9099; font-size:12px; }
.recent-day { display:flex; align-items:center; justify-content:space-between; padding:6px 8px; color:#8a9099; font-size:13px; }
.recent-day .badge { background:#f0f1f3; border-radius:10px; padding:1px 8px; font-size:12px; }
.recent-task { display:flex; align-items:center; justify-content:space-between; padding:8px; font-size:14px; cursor:pointer; border-radius:8px; background:#f1edff; }
.recent-task .rt-left { display:flex; align-items:center; gap:8px; }
.recent-task .dot-ok { color:#52c41a; }
.recent-task .rt-time { color:#b0b4bb; font-size:12px; }
.side-user { margin-top:auto; display:flex; align-items:center; gap:10px; padding:10px 6px; border-top:1px solid #eceef1; }
.side-user .uav { width:34px; height:34px; border-radius:50%; background:#d9d0ff; color:#6b46f5; display:flex; align-items:center; justify-content:center; font-weight:700; }
.side-user .uinfo .n { font-size:14px; font-weight:600; }
.side-user .uinfo .d { font-size:12px; color:#8a9099; }

/* 中间对话区 */
.chat { flex:1; display:flex; flex-direction:column; background:#fff; border-right:1px solid #eceef1; overflow:hidden; min-width:0; transition:flex-basis .25s ease, max-width .25s ease; }
/* 唤起操作区后：会话区收窄为固定宽度，让出空间给右侧操作区 */
body.ws-open .chat { flex:0 0 460px; max-width:460px; }
.chat-head { height:58px; display:flex; align-items:center; padding:0 24px; border-bottom:1px solid #eceef1; flex-shrink:0; }
.chat-head .ct { font-size:16px; font-weight:700; }
.chat-head .edit { color:#b0b4bb; margin-left:8px; cursor:pointer; }
.chat-head .spacer { flex:1; }
.chat-head .hi { color:#8a9099; cursor:pointer; }
.msgs { flex:1; overflow-y:auto; padding:24px; min-height:0; }
.msg-user { display:flex; justify-content:flex-end; margin-bottom:22px; }
.msg-user .bubble { background:#f0f1f3; border-radius:12px; padding:10px 16px; font-size:14px; max-width:70%; }
.msg-ai { display:flex; gap:12px; margin-bottom:22px; }
.msg-ai .ai-av { width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg,#ff4d4f,#e01c1c); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex-shrink:0; }
.msg-ai .ai-body { flex:1; max-width:88%; }
.msg-ai .ai-name { font-size:14px; font-weight:600; margin-bottom:8px; }
.fold { display:inline-flex; align-items:center; gap:6px; font-size:13px; color:#12a150; background:#f6fef9; border:1px solid #d3f0df; border-radius:8px; padding:5px 12px; margin-bottom:10px; cursor:pointer; }
.fold.tool { color:#1677ff; background:#f0f7ff; border-color:#cfe3ff; }
.fold.intent { color:#722ed1; background:#f9f0ff; border-color:#e6d3ff; }
.fold .arrow { transition:transform .2s; }
.fold-content { font-size:13px; color:#5c6169; background:#fafbfc; border:1px solid #f0f1f3; border-radius:8px; padding:12px 14px; margin-bottom:10px; line-height:1.7; white-space:pre-wrap; }
.ai-text { font-size:14px; line-height:1.8; color:#1f2329; }
.ai-text b { color:#1f2329; }
.ai-text .q { margin:10px 0; }
.ai-text .q .qn { font-weight:700; }

/* 选项气泡 */
.opts { display:flex; flex-wrap:wrap; gap:10px; margin:14px 0 4px; }
.opt { border:1px solid #d9dce1; border-radius:10px; padding:9px 16px; font-size:14px; cursor:pointer; background:#fff; transition:all .15s; }
.opt:hover { border-color:#6b46f5; color:#6b46f5; background:#faf9ff; }
.msg-done { display:flex; align-items:center; gap:14px; margin-top:12px; color:#12a150; font-size:13px; }
.msg-done .time { color:#b0b4bb; }
.msg-done .ic { color:#b0b4bb; cursor:pointer; }

/* 澄清卡片（多槽/多Tab/渐进填充） */
.clarify-card { border:1px solid #e6d3ff; border-radius:12px; margin:12px 0; overflow:hidden; }
.cc-head { background:#f9f0ff; padding:11px 16px; font-size:13px; font-weight:700; color:#722ed1; display:flex; align-items:center; gap:6px; }
.cc-tabs { display:flex; border-bottom:1px solid #f0f1f3; background:#fafbfc; overflow-x:auto; }
.cc-tab { padding:10px 16px; font-size:13px; cursor:pointer; color:#8a9099; border-bottom:2px solid transparent; white-space:nowrap; }
.cc-tab.active { color:#722ed1; border-bottom-color:#722ed1; font-weight:600; }
.cc-tab.filled { color:#12a150; }
.cc-tab .dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:#ff4d4f; margin-left:5px; }
.cc-tab.filled .dot { background:#52c41a; }
.cc-pane { padding:14px 16px; }
.cc-label { font-size:13px; color:#5c6169; margin-bottom:10px; }
.cc-label .req { color:#ff4d4f; margin-left:3px; }
.cc-opts { display:flex; flex-wrap:wrap; gap:9px; }
.cc-opt { border:1px solid #d9dce1; border-radius:9px; padding:8px 14px; font-size:13px; cursor:pointer; background:#fff; }
.cc-opt:hover { border-color:#722ed1; color:#722ed1; }
.cc-opt.sel { border-color:#722ed1; background:#f9f0ff; color:#722ed1; font-weight:600; }
.cc-input { display:flex; gap:8px; margin-top:10px; }
.cc-input input { flex:1; border:1px solid #d9dce1; border-radius:8px; padding:8px 12px; font-size:13px; outline:none; }
.cc-input input:focus { border-color:#722ed1; }
.cc-foot { padding:12px 16px; border-top:1px solid #f0f1f3; display:flex; align-items:center; gap:10px; }
.cc-hint { font-size:12px; color:#b0b4bb; flex:1; }
.cc-btn { border:none; border-radius:9px; padding:8px 18px; font-size:13px; font-weight:600; cursor:pointer; }
.cc-btn.primary { background:#6b46f5; color:#fff; }
.cc-btn.primary:disabled { background:#d9dce1; cursor:not-allowed; }
.cc-btn.ghost { background:#fff; border:1px solid #d9dce1; color:#5c6169; }

/* 卡片式产出 */
.mini-card { border:1px solid #eceef1; border-radius:10px; padding:14px 16px; margin:12px 0; }
.mini-title { font-size:14px; font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:6px; }
.mini-metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:8px; }
.mm { background:#fafbfc; border-radius:8px; padding:10px; text-align:center; }
.mm .v { font-size:19px; font-weight:800; }
.mm .l { font-size:11px; color:#8a9099; margin-top:2px; }
table { width:100%; border-collapse:collapse; font-size:12.5px; }
th,td { text-align:left; padding:8px 10px; border-bottom:1px solid #f0f1f3; }
th { color:#8a9099; font-weight:600; background:#fafbfc; }
.num-red { color:#cf1322; font-weight:600; }
.num-green { color:#12a150; font-weight:600; }
.num-blue { color:#1677ff; font-weight:600; }
.tag { display:inline-block; padding:2px 9px; border-radius:6px; font-size:11.5px; font-weight:600; }
.tag-red { background:#fff1f0; color:#cf1322; }
.tag-blue { background:#e6f4ff; color:#1677ff; }
.tag-gray { background:#f0f1f3; color:#8a9099; }
.tag-green { background:#f6ffed; color:#12a150; }
.tag-purple { background:#f9f0ff; color:#722ed1; }
.push-card { background:#fff; border:1px solid #eceef1; border-radius:10px; overflow:hidden; margin:10px 0; box-shadow:0 2px 8px rgba(0,0,0,.05); }
.push-card .pc-head { padding:11px 14px; font-size:14px; display:flex; align-items:center; gap:8px; border-bottom:1px solid #f0f1f3; }
.push-card .pc-body { padding:11px 14px; font-size:13px; color:#5c6169; line-height:1.7; }

/* 输入区 */
.composer { padding:16px 24px 20px; flex-shrink:0; }
.composer-box { border:1.5px solid #d9dce1; border-radius:14px; padding:14px 16px 10px; }
.composer-box:focus-within { border-color:#6b46f5; }
.composer textarea { width:100%; border:none; outline:none; resize:none; font-size:14px; font-family:inherit; min-height:26px; max-height:120px; }
.composer textarea::placeholder { color:#b0b4bb; }
.composer-tools { display:flex; align-items:center; gap:10px; margin-top:8px; }
.ct-btn { border:1px solid #e3e6eb; border-radius:8px; padding:6px 12px; font-size:13px; color:#5c6169; cursor:pointer; display:flex; align-items:center; gap:5px; }
.ct-btn:hover { background:#f5f6fa; }
.send { margin-left:auto; width:36px; height:36px; border-radius:50%; background:#6b46f5; color:#fff; border:none; cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; }
.send:hover { background:#5a37e0; }
.hint-chips { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
.hint-chip { font-size:12px; color:#6b46f5; background:#f5f2ff; border:1px solid #e6d3ff; border-radius:20px; padding:5px 12px; cursor:pointer; }
.hint-chip:hover { background:#ece5ff; }

/* 右侧上下文 */
.context { width:300px; background:#fff; flex-shrink:0; padding:18px 20px; overflow-y:auto; }
.ctx-head { display:flex; align-items:center; margin-bottom:18px; }
.ctx-head .t { font-size:16px; font-weight:700; }
.ctx-head .hi { margin-left:auto; color:#b0b4bb; cursor:pointer; }
.ctx-sec { margin-bottom:22px; }
.ctx-sec .sh { display:flex; align-items:center; font-size:14px; font-weight:700; margin-bottom:10px; }
.ctx-sec .sh .caret { margin-left:auto; color:#b0b4bb; }
.ctx-empty { font-size:13px; color:#b0b4bb; }
.slot-item { display:flex; align-items:flex-start; gap:8px; padding:8px 10px; background:#fafbfc; border-radius:8px; margin-bottom:6px; font-size:13px; }
.slot-item .si-k { color:#8a9099; flex-shrink:0; }
.slot-item .si-v { color:#1f2329; font-weight:600; margin-left:auto; text-align:right; }
.slot-item.missing .si-v { color:#ff4d4f; font-weight:400; }
.slot-item.missing { background:#fff8f8; }
.plan-step { display:flex; gap:10px; padding:8px 0; font-size:13px; }
.plan-step .ps-ic { width:18px; height:18px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; background:#eceef1; color:#8a9099; }
.plan-step.done .ps-ic { background:#52c41a; color:#fff; }
.plan-step.active .ps-ic { background:#6b46f5; color:#fff; }
.plan-step .ps-t { color:#5c6169; }
.plan-step.active .ps-t { color:#1f2329; font-weight:600; }
.ctx-doc, .ctx-skill { font-size:13px; color:#3d424b; padding:7px 10px; background:#fafbfc; border-radius:8px; margin-bottom:6px; display:flex; align-items:center; gap:6px; }
.ctx-skill code { font-size:12px; color:#6b46f5; }
.conf-bar { height:6px; background:#eceef1; border-radius:6px; overflow:hidden; margin-top:6px; }
.conf-bar .cb { height:100%; background:#52c41a; transition:width .4s; }

.toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#1f2329; color:#fff; padding:12px 22px; border-radius:10px; font-size:14px; opacity:0; transition:opacity .3s; z-index:999; }
.toast.show { opacity:1; }.typing { display:inline-flex; gap:4px; padding:4px 0; }
.typing span { width:7px; height:7px; border-radius:50%; background:#c4c8ce; animation:blink 1.2s infinite; }
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink { 0%,60%,100%{opacity:.3}30%{opacity:1} }

/* 推送汇总维度选择器 */
.push-dims { display:flex; flex-wrap:wrap; gap:9px; margin:12px 0; }
.pd-chip { border:1px solid #d9dce1; border-radius:9px; padding:8px 14px; font-size:13px; cursor:pointer; background:#fff; }
.pd-chip:hover { border-color:#6b46f5; color:#6b46f5; }
.pd-chip.sel { border-color:#6b46f5; background:#faf9ff; color:#6b46f5; font-weight:600; }
.fmt-pick { display:flex; gap:9px; margin:10px 0; }
.fmt-btn { flex:1; border:1px solid #d9dce1; border-radius:10px; padding:12px; text-align:center; font-size:13px; cursor:pointer; }
.fmt-btn:hover { border-color:#6b46f5; }
.fmt-btn.sel { border-color:#6b46f5; background:#faf9ff; color:#6b46f5; font-weight:600; }
.fmt-btn .fb-ic { font-size:20px; display:block; margin-bottom:4px; }
.fmt-btn .fb-sub { font-size:11px; color:#8a9099; margin-top:3px; }

/* 生成产物缩略卡 */
.gen-card { border:1px solid #eceef1; border-radius:10px; margin:12px 0; overflow:hidden; }
.gen-head { background:#fafbfc; padding:10px 14px; font-size:13px; font-weight:700; display:flex; align-items:center; gap:6px; border-bottom:1px solid #f0f1f3; }
.gen-head .gh-badge { margin-left:auto; font-size:11px; padding:2px 9px; border-radius:6px; background:#f9f0ff; color:#722ed1; }
.gen-body { padding:14px; display:flex; gap:14px; align-items:flex-start; }
.gen-thumb { width:132px; flex-shrink:0; border:1px solid #eceef1; border-radius:8px; overflow:hidden; cursor:pointer; }
.gen-thumb img { width:100%; display:block; }
.gen-meta { flex:1; font-size:13px; color:#5c6169; line-height:1.9; }
.gen-actions { display:flex; gap:8px; margin-top:10px; }
.gen-btn { border:1px solid #d9dce1; border-radius:8px; padding:6px 14px; font-size:12.5px; cursor:pointer; background:#fff; }
.gen-btn.primary { background:#6b46f5; color:#fff; border-color:#6b46f5; }
.gen-btn:hover { opacity:.9; }

/* 京Me 发送成功回执 */
.jm-receipt { border:1px solid #d3f0df; background:#f6fef9; border-radius:10px; padding:11px 14px; margin:12px 0; font-size:13px; color:#12a150; display:flex; align-items:center; gap:8px; }

/* 预览弹窗 */
.modal-mask { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:1000; }
.modal-mask.show { display:flex; }
.modal { background:#fff; border-radius:14px; max-width:90vw; max-height:88vh; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 12px 40px rgba(0,0,0,.25); }
.modal-head { padding:14px 18px; border-bottom:1px solid #f0f1f3; display:flex; align-items:center; font-size:15px; font-weight:700; }
.modal-head .mc { margin-left:auto; cursor:pointer; color:#8a9099; font-size:20px; }
.modal-body { padding:18px; overflow:auto; }
.modal-body img { display:block; border:1px solid #eceef1; border-radius:8px; }
.modal-body iframe { width:760px; max-width:86vw; height:60vh; border:1px solid #eceef1; border-radius:8px; background:#fff; }

@keyframes blink { 0%,60%,100%{opacity:.3}30%{opacity:1} }

/* ===== 工作面板「插件框架」范式 ===== */
.workspace { flex:1; display:flex; flex-direction:column; background:#fff; overflow:hidden; min-width:0; }
.ws-head { height:58px; display:flex; align-items:center; padding:0 24px; border-bottom:1px solid #eceef1; flex-shrink:0; }
.ws-head .wt { font-size:16px; font-weight:700; }
.ws-head .spacer { flex:1; }
.ws-head .hi { color:#b0b4bb; cursor:pointer; }
.ws-head .ws-close { display:inline-flex; align-items:center; gap:5px; font-size:13px; font-weight:600; color:#8a9099; cursor:pointer; padding:6px 12px; border:1px solid #e3e6eb; border-radius:8px; transition:all .15s; user-select:none; }
.ws-head .ws-close:hover { color:#cf1322; border-color:#f0b3b3; background:#fff5f5; }
.ws-body { flex:1; overflow-y:auto; padding:20px 24px; }

/* 黄金流程导航 */
.golden-flow { display:flex; align-items:center; gap:6px; margin-bottom:20px; flex-wrap:wrap; }
.gf-step { display:flex; align-items:center; gap:7px; border:1px solid #e3e6eb; border-radius:22px; padding:8px 18px; font-size:14px; font-weight:600; color:#5c6169; background:#fff; cursor:pointer; transition:all .15s; }
.gf-step .gf-ic { font-size:14px; }
.gf-step.active { background:#1f2329; color:#fff; border-color:#1f2329; }
.gf-step.done { color:#12a150; border-color:#d3f0df; background:#f6fef9; }
.gf-arrow { color:#c4c8ce; font-size:13px; }

/* 目标区（指标带） */
.ws-goal { border:1px solid #eceef1; border-radius:12px; padding:16px 20px; margin-bottom:16px; background:#fafbfc; }
.ws-goal .wg-label { font-size:12px; color:#8a9099; font-weight:600; margin-bottom:12px; letter-spacing:.5px; }
.wg-metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.wg-m { text-align:center; }
.wg-m .v { font-size:22px; font-weight:800; color:#1f2329; }
.wg-m .v.red { color:#cf1322; }
.wg-m .v.blue { color:#1677ff; }
.wg-m .v.green { color:#12a150; }
.wg-m .l { font-size:12px; color:#8a9099; margin-top:4px; }

/* 货盘区（Tab切换） */
.ws-pallet { display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
.pallet-tab { flex:1; min-width:140px; border:1px solid #e3e6eb; border-radius:10px; padding:14px 16px; cursor:pointer; background:#f7f8fa; transition:all .15s; }
.pallet-tab:hover { border-color:#6b46f5; }
.pallet-tab.active { border-color:#6b46f5; background:#faf9ff; box-shadow:0 0 0 1px #6b46f5 inset; }
.pallet-tab .pt-name { font-size:14px; font-weight:700; color:#1f2329; }
.pallet-tab .pt-sub { font-size:12px; color:#8a9099; margin-top:4px; }

/* 策略主区 */
.ws-strategy { border:1px solid #eceef1; border-radius:12px; min-height:280px; padding:20px; }
.ws-strategy .wst-label { font-size:12px; color:#8a9099; font-weight:600; margin-bottom:14px; letter-spacing:.5px; }
.ws-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 20px; color:#b0b4bb; text-align:center; }
.ws-empty .we-ic { font-size:34px; margin-bottom:12px; opacity:.5; }
.ws-empty .we-t { font-size:14px; }

/* 会话区激发卡片 */
.trigger-wrap { border:1px solid #eceef1; border-radius:12px; margin:0 24px 12px; overflow:hidden; }
.trigger-cards { display:flex; gap:10px; padding:14px; }
.trigger-card { flex:1; border:1px solid #e3e6eb; border-radius:10px; padding:12px 14px; cursor:pointer; background:#fafbfc; transition:all .15s; }
.trigger-card:hover { border-color:#6b46f5; background:#faf9ff; }
.trigger-card .tc-t { font-size:13px; font-weight:700; color:#1f2329; }
.trigger-card .tc-d { font-size:12px; color:#8a9099; margin-top:5px; line-height:1.5; }
.trigger-fold { text-align:center; padding:8px; font-size:13px; color:#8a9099; cursor:pointer; border-top:1px solid #f0f1f3; }
.trigger-fold:hover { background:#fafbfc; }

/* ===== 首屏：指标面板 + 部门切换 + 意图猜测（可收起，遵循「插件框架范式」——激发卡片位于会话区顶部，底部对话框固定） ===== */
.home-panel { margin:0 24px 4px; flex-shrink:0; }
.home-panel.collapsed .hp-body { display:none; }
.hp-fold { display:flex; align-items:center; justify-content:center; gap:6px; padding:8px; font-size:12.5px; color:#8a9099; cursor:pointer; border-top:1px solid #f0f1f3; margin-top:8px; }

/* ===== 对话区 HTML 文档卡（点击右侧面板展开） ===== */

/* ===== 小Y思考链（四步） ===== */

.xy-think .xt-cursor { color:#6b46f5; font-weight:400; animation:xtBlink .8s steps(1) infinite; }
@keyframes xtBlink { 50%{opacity:0;} }

  /* ============ 输入增维钩子 + 小Y四步思考链 ============
   *  用户在对话框输入「增加XX维度」→ 拦截 → 小Y思考：识别理解→澄清确认→数据追溯加工→输出新HTML
   *  关键约束：不主动提问，仅响应用户输入 */
  function reportInputHook(text){
    if(!REPORT_CTX) return false;            // 未生成报告，不接管
    var t=(text||'').trim();
    /* —— 发送/通知类意图识别（分层置信）——
     *  动词：发送/发给/推/推给/转发/转给/知会/告知/同步/发到…群/@…
     *  对象：采销/采控/同事/群/负责人/经理/所有/全部/相关…
     *  高置信=动词+对象 → 直接走思考链；中置信=只命中一侧且疑似指向报告 → 反问确认；低置信 → 放行 */
    var hasVerb = /(发送|发给|发一?下|推送|推给|推一?下|转发|转给|下发|同步给|同步到|发到|群发|知会|告知|通知|@)/.test(t);
    var hasTarget = /(采销|采购|采控|同事|同学|老板|领导|群|群里|所有|全部|全体|相关|负责人|对接人|经理|主管)/.test(t);
    /* 指代当前报告：这个/该报告/报告/它，或裸动词但正处于报告上下文 */
    var refReport = /(这个|该|此|报告|它|结果|文档)/.test(t) || hasTarget;
    var sendConf = 0;
    if(hasVerb && hasTarget) sendConf = 2;                 // 高置信
    else if(hasVerb && refReport) sendConf = 1;            // 中置信（动词明确、对象模糊）
    else if(hasTarget && /(报告|这个|它|文档|结果)/.test(t)) sendConf = 1; // 有对象+指代但动词弱
    if(sendConf===2){
      addUser(text);
      document.getElementById('hintChips').innerHTML='';
      if(typeof delay==='function') delay(function(){ runReportSendThink(text); });
      return true;
    }
    if(sendConf===1){
      addUser(text);
      document.getElementById('hintChips').innerHTML='';
      if(typeof delay==='function') delay(function(){ confirmSendIntent(text); });
      return true;
    }
    /* 识别是否为「增维/加数据」类需求：命中关键词才接管，否则放行给通用意图理解 */
    var isAdd = /(增加|加上|加个|新增|补充|再加|想在报告|加进|添加).*(维度|数据|指标|GMV|gmv|销售额|销量|库存|周转|毛利|退货|动销|供应商)/.test(t)
             || /(增加|加上|新增|补充).{0,12}(过去|近|最近)?\s*\d+\s*天/.test(t)
             || /报告.*(增加|加|补充|新增)/.test(t);
    if(!isAdd) return false;
    addUser(text);
    document.getElementById('hintChips').innerHTML='';
    if(typeof delay==='function') delay(function(){ runReportDimThink(text); });
    return true;                             // 已接管
  }
  /* 中置信：意图疑似发送但不完全确定 → 反问用户确认「您是不是想把报告发送给XX？」 */
  function confirmSendIntent(text){
    var s=parseSendIntent(text);
    var guessTarget = s.recips.length
      ? s.recips.map(function(r){ return r.role==='群'?r.note:r.role; }).join('、')
      : (/(采销|采购)/.test(text)?'相关采销':(/采控/.test(text)?'相关采控':'预警相关的采销/采控'));
    var card='<div class="send-card"><div class="sp-top"><span class="sp-ic">&#129300;</span>'
      +'<span class="sp-title">意图确认</span><span class="sp-badge">待您确认</span></div>'
      +'<div class="sp-sec-t" style="padding-top:12px;">我的理解</div>'
      +'<div class="sp-chan">您是不是想把 <b>'+reportName()+'</b> 发送/推送给 <b>'+guessTarget+'</b>？</div>'
      +'<div class="sp-acts">'
      +'<button class="sp-btn primary" data-act="yes">是的，去发送</button>'
      +'<button class="sp-btn" data-act="no">不是，我说别的</button>'
      +'</div></div>';
    var aiEl=addAI('我理解您可能想<b>发送这份报告</b>，但表述不完全明确，先跟您确认一下：', null,
      [{type:'intent', text:'意图分类：疑似报告发送/通知（置信 68%，需确认）\n识别到的线索：'+ (/(发|推|转|同步|知会|告知)/.test(text)?'发送类动词':'') + (/(采销|采控|群|所有|相关)/.test(text)?' / 收件对象线索':'') +'\n推测收件对象：'+guessTarget}],
      card);
    setTimeout(function(){
      var c=aiEl?aiEl.querySelector('.send-card'):null;
      if(!c){ var all=document.querySelectorAll('.send-card'); c=all[all.length-1]; }
      if(!c) return;
      c.querySelectorAll('.sp-btn').forEach(function(btn){
        btn.onclick=function(){
          var act=btn.getAttribute('data-act');
          c.querySelectorAll('.sp-btn').forEach(function(b){ b.disabled=true; b.style.opacity=.5; });
          if(act==='yes'){
            if(typeof addUser==='function') addUser('是的，去发送');
            if(typeof delay==='function') delay(function(){ runReportSendThink(text); });
          } else {
            if(typeof addUser==='function') addUser('不是');
            if(typeof delay==='function') delay(function(){ addAI('好的，那您可以直接告诉我想做什么，比如「在报告里增加过去30天GMV」或「把报告发给家纺预警群」。'); });
          }
        };
      });
    },30);
  }
  /* 解析发送意图：收件对象 + 渠道 + 是否明确 */
  function parseSendIntent(text){
    var t=text||'';
    var toSales   = /采销/.test(t);
    var toControl = /采控/.test(t);
    var group     = t.match(/(发到|发送到|发去|同步到)?\s*([^\s，,。]{2,12})群/);
    var groupName = group?group[2]+'群':'';
    var all       = /(所有|全部|全体|相关|预警)/.test(t);
    var recips=[];
    if(toSales)   recips.push({role:'采销', cnt:all?12:1, note:all?'预警覆盖的全部采销':'指定采销'});
    if(toControl) recips.push({role:'采控', cnt:all?4:1, note:all?'预警覆盖的全部采控':'指定采控'});
    if(groupName) recips.push({role:'群', cnt:1, note:groupName});
    /* 是否需澄清：没识别到明确收件对象，或"某某群"占位不清 */
    var clarify = recips.length===0 || /某某|xx|XX|哪个|谁/.test(t);
    return { recips:recips, groupName:groupName, all:all, clarify:clarify, raw:t };
  }
  /* 从用户自然语言解析出新增维度（演示：识别 GMV / 销量等常见诉求） */
  function parseExtraDim(text){
    var t=text||'';
    var mDays=t.match(/(\d+)\s*天/); var days=mDays?mDays[1]:'30';
    if(/GMV|gmv|销售额|成交额/.test(t)){
      return { key:'gmv', l:'预警商品过去 '+days+' 天 GMV', clarify:false,
        src:'query_sku_gmv(sku_list, window='+days+'d) · 数据源 dwd_trade_order_detail',
        head:'<tr><th>C3 品类</th><th>预警商品数</th><th>近 '+days+' 天 GMV</th><th>GMV 占部门</th><th>件单价</th><th>动销率</th></tr>',
        body:[['四件套','58','¥ 1,286 万','18.6%','¥ 118','82%'],
              ['冬被','35','¥ 942 万','13.6%','¥ 256','74%'],
              ['毛巾','42','¥ 508 万','7.3%','¥ 46','91%'],
              ['收纳','28','¥ 366 万','5.3%','¥ 79','68%']].map(function(r){return '<tr><td>'+r.join('</td><td>')+'</td></tr>';}).join('') };
    }
    if(/销量|销售件数|动销/.test(t)){
      return { key:'sales', l:'预警商品过去 '+days+' 天销量', clarify:false,
        src:'query_sku_sales_qty(sku_list, window='+days+'d) · 数据源 dwd_trade_order_detail',
        head:'<tr><th>C3 品类</th><th>预警商品数</th><th>近 '+days+' 天销量</th><th>环比</th><th>动销率</th></tr>',
        body:[['四件套','58','10.9 万件','+12%','82%'],['冬被','35','3.7 万件','+6%','74%'],['毛巾','42','11.0 万件','+18%','91%']].map(function(r){return '<tr><td>'+r.join('</td><td>')+'</td></tr>';}).join('') };
    }
    /* 兜底：无法精确解析口径 → 标记需澄清 */
    return { key:'unknown', l:t.replace(/^.*?(增加|加上|新增|补充|添加)/,'').trim()||'新增分析维度', clarify:true };
  }

      [{type:'intent', text:'意图分类：报告维度扩展（置信 94%）\n目标报告：'+reportName()+'\n新增维度：'+dim.l+'\n是否需澄清：'+(dim.clarify?'是（已用安全默认口径）':'否')}],

    var i=0;
    function typeStep(){
      if(!box) return;
      if(i>=steps.length){
        REPORT_EXTRA_DIMS.push(dim);
        if(typeof delay==='function') delay(function(){ emitReportDocCard(true); });
        return;
      }
      var s=steps[i];
      var stepEl=document.createElement('div');
      stepEl.className='xt-step typing';
      stepEl.innerHTML='<div class="xt-h"><span class="xt-n">'+s.n+'</span>'+s.t+' <span class="xt-cursor">&#9613;</span></div><div class="xt-b"></div>';
      box.appendChild(stepEl);
      if(typeof scrollBottom==='function') scrollBottom();
      var bodyEl=stepEl.querySelector('.xt-b');
      var full=s.b, p=0;
      var timer=setInterval(function(){
        p=Math.min(full.length, p+Math.max(6, Math.round(full.length/8)));

        if(p>=full.length){
          clearInterval(timer);
          var cur=stepEl.querySelector('.xt-cursor'); if(cur) cur.remove();
          stepEl.classList.remove('typing');
          i++;
          setTimeout(typeStep, 420);

  /* 明细颗粒（每 2.5% 一档，带前毛率中值 mid，用于按任意断点重新聚合）；字段：[商品数, 采购额万, 销售额万] */
  var MARGIN_GRAIN = {

  /* 边界规则：右闭左开(rightClosed=true) 或 左闭右开 */
  var MARGIN_BREAKS = [30,20,10,0,-10,-20,-30];  /* 从高到低的断点 */
  var MARGIN_RANGE = { hi:Infinity, lo:-Infinity }; /* 用户关注范围（%），默认全量 */
  var MARGIN_RIGHT_CLOSED = true;                  /* 默认「左开右闭」(a,b] */
  var TIER_COLORS = ['#0b7a3b','#12a150','#52c41a','#73d13d','#faad14','#fa8c16','#ff7a45','#ff4d4f','#cf1322','#a8071a'];
  function fmtWan(n){ return '¥ '+n.toLocaleString('zh-CN',{minimumFractionDigits:1,maximumFractionDigits:1})+' 万'; }
  /* 依据断点 breaks + 关注范围 range + 边界规则，生成有序区间 [{lo,hi,label,neg,c}] */
  function buildTiers(breaks, range, rightClosed){
    range = range || MARGIN_RANGE; rightClosed = (rightClosed!==false);
    /* 收集范围内的有效边界（含 range 端点），去重排序（从高到低） */
    var edges = breaks.slice().filter(function(b){ return b<range.hi && b>range.lo; });
    var pts = [range.hi].concat(edges).concat([range.lo]);
    pts = pts.filter(function(v,i,a){ return a.indexOf(v)===i; }).sort(function(a,b){ return b-a; });
    var tiers=[];
    for(var i=0;i<pts.length-1;i++){
      var hi=pts[i], lo=pts[i+1];
      tiers.push({ lo:lo, hi:hi, neg:(hi<=0), c:TIER_COLORS[i]||'#cf1322', label:tierLabel(lo,hi,rightClosed) });
    }
    return tiers;
  }
  /* 生成区间文字，自动处理 ±∞ 为开区间 */
  function tierLabel(lo, hi, rightClosed){
    var pf=function(v){ return (v>0?'+':'')+v+'%'; };
    var hiInf = !isFinite(hi), loInf = !isFinite(lo);
    if(hiInf && loInf) return '全部';
    if(hiInf) return rightClosed ? ('> '+pf(lo)) : ('≥ '+pf(lo));               /* 上端 +∞ → 开 */
    if(loInf) return rightClosed ? ('≤ '+pf(hi)) : ('< '+pf(hi));                /* 下端 -∞ → 开 */
    var L=rightClosed?'(':'[', R=rightClosed?']':')';
    return L+pf(lo)+', '+pf(hi)+R;
  }
  /* 把明细颗粒按区间聚合，返回 [商品数,数量占比,采购额,采购占比,销额,销占比] */
  function aggregateTiers(dept, tiers){
    var grain = MARGIN_GRAIN[dept] || MARGIN_GRAIN['家纺'];
    var totC=0, totP=0, totS=0;
    grain.forEach(function(g){ totC+=g[0]; totP+=g[1]; totS+=g[2]; });
    /* 仅统计落入 [range.lo, range.hi] 内颗粒作为占比分母（关注范围内占比） */
    var rows = tiers.map(function(t){
      var c=0,p=0,s=0;
      grain.forEach(function(g){
        var m=g[3];
        var hit = (isFinite(t.hi)? (MARGIN_RIGHT_CLOSED? m<=t.hi : m<t.hi) : true)
               && (isFinite(t.lo)? (MARGIN_RIGHT_CLOSED? m>t.lo : m>=t.lo) : true);
        if(hit){ c+=g[0]; p+=g[1]; s+=g[2]; }
      });
      return [c,p,s];
    });
    /* 关注范围内的分母 = 各区间之和 */
    var sc=0,sp=0,ss=0; rows.forEach(function(r){ sc+=r[0]; sp+=r[1]; ss+=r[2]; });
    sc=sc||1; sp=sp||1; ss=ss||1;
    return rows.map(function(r){ return [r[0], r[0]/sc*100, r[1], r[1]/sp*100, r[2], r[2]/ss*100]; });
  }

      +'<div class="mg-thr"><span>边界规则：<b>'+ruleTxt+'</b>；断点：'+brkTxt+'（触及 ±∞ 端点自动取开区间）</span>'

  /* 解析用户自由输入的分层诉求，命中返回 {breaks,range,hint}，否则 null */
  function parseMarginInput(text){
    if(!text) return null;
    var t = String(text).replace(/％/g,'%');
    var isMargin = /(分层|阈值|区间|档|前毛|倒挂|以下|以上)/.test(t);
    if(!isMargin) return null;
    /* 抽取所有带正负号的百分数（含"负10"这种） */
    var nums = [];
    var re = /(-|负|正|\+)?\s*(\d+(?:\.\d+)?)\s*%?/g, m;
    while((m=re.exec(t))!==null){
      if(m[2]===undefined) continue;
      var v = parseFloat(m[2]); if(isNaN(v)) continue;
      if(m[1]==='-'||m[1]==='负') v=-v;
      nums.push(v);
    }
    /* 关注范围：只看 X 以下 / 以上 */
    var range = { hi:Infinity, lo:-Infinity };
    var below = t.match(/([\-负正\+]?\s*\d+(?:\.\d+)?)\s*%?\s*以下/);
    var above = t.match(/([\-负正\+]?\s*\d+(?:\.\d+)?)\s*%?\s*以上/);
    var toNum = function(s){ s=s.replace(/\s/g,''); var neg=/^[-负]/.test(s); var n=parseFloat(s.replace(/[^\d.]/g,'')); return neg?-n:n; };
    if(below){ range.hi = toNum(below[1]); }
    if(above){ range.lo = toNum(above[1]); }
    /* 断点 = 抽出的数字中，落在范围内、去掉与范围端点重复的 */
    var breaks = nums.filter(function(v){ return v<range.hi && v>range.lo; });
    breaks = breaks.filter(function(v,i,a){ return a.indexOf(v)===i; }).sort(function(a,b){ return b-a; });
    if(breaks.length===0 && !isFinite(range.hi) && !isFinite(range.lo)) return null; /* 没抽到有效信息 */
    if(breaks.length===0) breaks = [];
    var hint = '识别到您的诉求：'
      + (isFinite(range.hi)||isFinite(range.lo) ? '关注范围 <b>'+tierLabel(range.lo, range.hi, true)+'</b>；' : '全量范围；')
      + (breaks.length? '断点 <b>'+breaks.map(function(b){return (b>0?'+':'')+b+'%';}).join(' / ')+'</b>。' : '（未指定中间断点，将作为单一区间）。');
    return { breaks:breaks, range:range, hint:hint };
  }

    return true;
  }

  /* --- 仿真对话流：配置全部在会话区完成，右侧仅展示规则清单/详情，测算完成后展示结果 --- */
  var SIM_CTX=null; // { fromRule, threshold, benchmark, scope:{cat,brand,supplier,band,white}, mode:'rule'|'custom' }
  /* 圈选商品池字段与【圈品详情】保持一致：货盘类型 / 供应商数量 / 供应商身份 / 商品销量band / 商品销售额band / 最近采购单完成天数 */
  function defaultScope(){ return { pallet:['1','2','3','无'], supNum:['一商','多商'], supId:['品牌','非品牌'], saleBand:['A','B','C','D','E','F','无'], amtBand:['A','B','C','D','E','F','无'], poDays:'365' }; }
  /* 把圈品详情 mock 的圈定值转成仿真商品池默认值（从某规则进入仿真时，商品池即该规则实际圈的品） */
  function scopeFromCircle(ruleName){
    var mock=(typeof CIRCLE_MOCK!=='undefined'&&CIRCLE_MOCK[ruleName])||(typeof CIRCLE_DEFAULT!=='undefined'&&CIRCLE_DEFAULT);
    if(!mock) return defaultScope();
    var pick=function(label,fallback){ var it=mock.f.filter(function(x){return x.k===label;})[0]; return it?it.on.slice():fallback; };
    var days=pick('最近采购单完成天数',['1 ~ 365 天'])[0]||'1 ~ 365 天';
    var d=(days.match(/(\d+)\s*天/g)||[]).map(function(x){return x.replace(/[^\d]/g,'');});
    return {
      pallet:pick('货盘类型',['1','2','3','无']),
      supNum:pick('供应商数量',['一商','多商']),
      supId:pick('供应商身份',['品牌','非品牌']),
      saleBand:pick('商品销量 band',['A','B','C','D','E','F','无']),
      amtBand:pick('商品销售额 band',['A','B','C','D','E','F','无']),
      poDays:d.length?d[d.length-1]:'365'
    };
  }

  function bindInlineSimConfig(cardId){
    var card=document.getElementById(cardId); if(!card) return;

      sel.onchange=function(){ SIM_CTX.threshold=sel.value; if(typeof addUser==='function') addUser('规则改为「'+sel.value+'」'); };
    });
    /* 商品池 checkbox */
    card.querySelectorAll('.is-vals[data-key]').forEach(function(row){
      var key=row.getAttribute('data-key');
      row.querySelectorAll('input[type=checkbox]').forEach(function(i){
        i.onchange=function(){
          var v=i.getAttribute('data-v');
          var arr=(SIM_CTX.scope[key]||[]).filter(function(x){return x!==v;});
          if(i.checked) arr.push(v);
          SIM_CTX.scope[key]=arr;
        };
      });
    });
    /* 最近采购单完成天数 radio */
    card.querySelectorAll('input[type=radio][data-pod]').forEach(function(i){
      i.onchange=function(){ if(i.checked) SIM_CTX.scope.poDays=i.getAttribute('data-pod'); };
    });

  function startSimFromRule(r){
    SIM_CTX={ mode:'rule', fromRule:r, threshold:r.threshold, scope:scopeFromCircle(r.name) };
    /* 右侧保留在规则清单/详情画面，配置改在会话区做 */

  /* ==================================================================

  function _wan元(n){ return (n/10000).toFixed(1)+' 万'; }  // 从"元"折算万元

    GT_L3.total = GT_L3.selected.reduce(function(a,p){return a+p.E_ΔC;},0);
    GT_L3.gap = Math.max(0, GT_L3.target - GT_L3.total);

      s.skus++; s.save+=p.E_ΔC; s.snegSum+=p.s_neg;

    GT_L3.suppliers = Object.keys(supMap).map(function(k){
      var s=supMap[k]; s.avgSneg=+(s.snegSum/s.skus).toFixed(2);

  function sparkline(nums, color){
    var w=140,h=36,max=Math.max.apply(null,nums),min=Math.min.apply(null,nums);
    var pts=nums.map(function(v,i){
      var x=(i/(nums.length-1))*w;
      var y=h - (max===min?h/2:(v-min)/(max-min)*h*0.8+h*0.1);
      return x.toFixed(1)+','+y.toFixed(1);
    }).join(' ');
    var dots=nums.map(function(v,i){
      var x=(i/(nums.length-1))*w;
      var y=h - (max===min?h/2:(v-min)/(max-min)*h*0.8+h*0.1);
      return '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="2.2" fill="'+color+'"/>';
    }).join('');
    return '<svg width="'+w+'" height="'+h+'"><polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="1.8"/>'+dots+'</svg>';
  }

      ['数码','快充充电器','绿联','绿联官方','品牌商','P2-数码配件','B','杨采销','钱采控','孙买手','18.6万','68.00','62.00','2026-06-15','68.00','-8.8%','64.20','63.00','65.00','6.8%']

    var body=mock.map(function(r){

        if(i===19) return '<td class="'+(neg?'num-red':'num-green')+'">'+c+'</td>';

      }).join('')+'</tr>';
    }).join('');
    return ''
    +'<div class="list-hint">'
    +'  &#128172; 支持在会话区通过对话调整展示内容，例如：'
    +'  <span class="list-chip">隐藏 band 列</span>'
    +'  <span class="list-chip">按降价幅度降序</span>'
    +'  <span class="list-chip">只看家居用品</span>'
    +'  <span class="list-chip">最近 7 天修改</span>'
    +'</div>'
    +'<div class="tbl-wrap tbl-scroll"><table><thead><tr>'
    +'<th>部门</th><th>品类</th><th>商品信息</th><th>品牌</th><th>供货商</th><th>供应商身份</th><th>货盘</th><th>band</th>'
    +'<th>责任采销</th><th>责任采控</th><th>责任买手</th>'
    +'<th>近30天销售额</th><th>近30天采购价</th><th>当前生效采购价</th><th>修改时间</th>'
    +'<th>调价前采购价</th><th>降价幅度</th>'
    +'<th>30天众数成交价</th><th>30天件单价</th><th>基准价</th><th>SKU前毛率</th>'
    +'</tr></thead><tbody>'+body+'</tbody></table></div>';
  }

  /* ===== 4.2 诊断策略仿真：当前策略 → 配置 → 4 类测算场景 → 仿真对比 ===== */
  var RULES=[
    {id:'r1',name:'前毛倒挂',def:'默认对比30天众数成交价',opts:['30天众数成交价','7天众数价','30天件单价'],extra:'支持调整阈值'},
    {id:'r2',name:'高于基准价',def:'默认巡检逻辑',opts:['是否包含同品'],extra:'支持调整阈值（高多少钱 / 高 XX%）'},
    {id:'r3',name:'采购成本上升',def:'默认高于上次采购价',opts:['高于上次采购价'],extra:'支持调整阈值（高多少钱 / 高 XX%）'},
    {id:'r4',name:'非多商最低价',def:'默认巡检逻辑',opts:['是否包含品牌商'],extra:'支持调整阈值（高多少钱 / 高 XX%）'},
    {id:'r5',name:'采购价无行业优势',def:'默认巡检逻辑',opts:['对比30天最低价','众数价','测算采购价'],extra:'支持修改计算逻辑；支持调整阈值'},
    {id:'r6',name:'采购价无POP优势',def:'默认巡检逻辑',opts:['对比7天最低价','30天最低价','众数价','测算采购价'],extra:'支持修改计算逻辑；支持调整阈值'},
    {id:'r7',name:'自定义场景',def:'自己输入规则进行交互',opts:[],extra:'在对话中描述自定义巡检规则'}
  ];
  var SCEN='hit'; // hit | benefit | change | query
  var STRAT_STATE='overview'; // overview | config
  function openStrategy(){
    showWs('工作面板 · 诊断策略仿真');
    STRAT_STATE='overview';
    var b=document.getElementById('wsBody'); if(!b)return;
    b.innerHTML=stratOverviewHtml();
    bindStratOverview();
    if(typeof addUser==='function'){ addUser('配置'+deptName()+'的诊断策略并仿真命中'); }
    if(typeof addAI==='function'){ addAI('已打开<b>诊断策略仿真</b>操作区。当前展示的是「<b>生效中策略</b>」概览，如需调整规则口径/阈值/剔除逻辑，点击「进入策略配置」或直接在对话中描述改动，例如「前毛倒挂改成 7 天众数」「加剔除不动销」。'); }
  }
  function stratOverviewHtml(){
    return ''
    +'<div class="strat-section">'
    +'  <div class="strat-h">&#127919; 当前生效中策略 <span class="strat-tag">GENERATION</span></div>'
    +'  <div class="cur-strat">'
    +'    <div class="cs-row">'
    +'      <div class="cs-item"><div class="cs-l">部门</div><div class="cs-v">'+deptName()+'</div></div>'
    +'      <div class="cs-item"><div class="cs-l">生效时间</div><div class="cs-v">2026-06-01</div></div>'
    +'      <div class="cs-item"><div class="cs-l">上次调整</div><div class="cs-v">2026-06-28（王运营）</div></div>'
    +'      <div class="cs-item"><div class="cs-l">当前命中 SKU</div><div class="cs-v"><b style="color:#cf1322;">459</b></div></div>'
    +'    </div>'
    +'    <hr style="border:none;border-top:1px dashed #d3f0df;margin:10px 0;">'
    +'    <div><b>已开启规则</b>：前毛倒挂（30天众数）· 高于基准价（含同品）· 非多商最低价（含品牌商）· 采购成本上升（>5%）</div>'
    +'    <div><b>剔除逻辑</b>：流水倒扣商品 · 不动销商品</div>'
    +'    <div><b>加白范围</b>：签约独家供应商 · 战略亏损 SKU 池</div>'
    +'  </div>'
    +'</div>'
    +'<div class="strat-config-hint">如需查询/修改规则、调整口径与阈值、剔除逻辑，请进入策略配置：</div>'
    +'<button class="enter-config-btn" id="enterCfg">&#9881; 进入策略配置 &amp; 仿真 &#8594;</button>';
  }
  function bindStratOverview(){
    var e=document.getElementById('enterCfg');
    if(e)e.onclick=function(){ STRAT_STATE='config';
      var b=document.getElementById('wsBody'); b.innerHTML=stratConfigHtml();
      bindStratConfig();
      if(typeof addAI==='function')addAI('已进入策略配置。当前测算场景默认为「<b>规则命中测算</b>」，共 <b>7 类</b>可查询/修改的规则场景 + 剔除逻辑。您可点击场景 Tab 切换到「效果测算 / 规则变更影响 / 数据查询」，或展开任一规则调整口径与阈值。');
    };
  }
  function stratConfigHtml(){
    var scens=[
      {k:'hit',    n:'规则命中测算',   d:'定范围·命中量级'},
      {k:'benefit',n:'效果测算',       d:'定目标·测节降'},
      {k:'change', n:'规则变更影响',   d:'新增/释放对比'},
      {k:'query',  n:'数据查询（查数）',d:'自定义维度查询'}
    ];
    var scenTabs=scens.map(function(s){
      return '<div class="scen-tab'+(SCEN===s.k?' sel':'')+'" data-scen="'+s.k+'"><b>'+s.n+'</b><span class="st-desc">'+s.d+'</span></div>';
    }).join('');
    var rows=RULES.map(function(r){
      var opts=r.opts.map(function(o,i){ return '<span class="rb-opt'+(i===0?' sel':'')+'">'+o+'</span>'; }).join('');
      return '<div class="rule-row" data-id="'+r.id+'"><div class="rule-head"><span class="rh-name">'+r.name+'</span><span class="rh-def">'+r.def+'</span><span class="rh-caret">&#9656;</span></div>'
        +'<div class="rule-body">'
        +(opts?'<div><span class="rb-k">对比 / 计算口径：</span>'+opts+'</div>':'<div>'+r.def+'</div>')
        +'<div style="margin-top:8px;"><span class="rb-k">阈值：</span>'+r.extra+'</div>'
        +'</div></div>';
    }).join('');
    return ''
    +'<div class="strat-section">'
    +'  <div class="strat-h">&#128203; 测算场景（选择本次仿真的目的）</div>'
    +'  <div class="scen-tabs">'+scenTabs+'</div>'
    +'  <div class="scen-desc" id="scenDesc" style="font-size:12px;color:#8a9099;margin-bottom:6px;"></div>'
    +'</div>'
    +'<div class="strat-section rule-cfg">'
    +'  <div class="strat-h">&#9881; 7 类规则（点击展开配置口径与阈值）</div>'
    +'  '+rows
    +'  <div class="rule-exclude"><div class="re-h">&#9988; 支持剔除逻辑</div>'
    +'  <div><span class="rb-opt sel">流水倒扣商品</span><span class="rb-opt sel">不动销商品</span><span class="rb-opt">供应商身份非品牌商</span><span class="rb-opt">自定义范围…</span></div>'
    +'  <div style="font-size:12px;color:#8a9099;margin-top:8px;">剔除某些不包含的商品范围，如流水倒扣、不动销商品等</div></div>'
    +'  <div class="rule-actions">'
    +'    <button class="rule-btn primary" id="ruleSim">&#9654; 仿真对比</button>'
    +'    <button class="rule-btn ghost" id="ruleReset">重置默认</button>'
    +'    <button class="rule-btn ghost" id="backOverview">&#8592; 返回概览</button>'
    +'  </div>'
    +'</div>'
    +'<div class="strat-section" id="simCompareHost"></div>';
  }
  var SCEN_DESC={
    hit:'摘要展示命中 SKU 数 / 供应商数 / 部门数；命中清单展示当前采购价和价差；统计分析展示品类/价差分布；洞察展示主要问题集中领域。',
    benefit:'摘要展示预计节降金额（含按部门/品类的节降分布）；命中清单展示目标价和预计节降金额；统计分析展示各品类节降占比；洞察展示优先处理建议和达成率预测。',
    change:'摘要新增「新增命中 SKU 数」「释放 SKU 数」两个卡片；命中清单区分「新增命中」「释放」两类；统计分析展示变更前后 SKU 状态变化对比。',
    query:'摘要展示查询结果核心聚合；命中清单展示明细数据；统计分析按查询维度自动聚合。'
  };
  function bindStratConfig(){
    var b=document.getElementById('wsBody');
    /* 规则展开 */
    b.querySelectorAll('.rule-head').forEach(function(h){ h.onclick=function(){ h.parentNode.classList.toggle('open'); }; });
    b.querySelectorAll('.rule-body').forEach(function(bd){
      bd.querySelectorAll('.rb-opt').forEach(function(o){ o.onclick=function(e){ e.stopPropagation();
        var grp=o.parentNode; if(grp.querySelector('.rb-k')){ grp.querySelectorAll('.rb-opt').forEach(function(x){x.classList.remove('sel');}); }
        o.classList.toggle('sel'); }; });
    });
    /* 场景 Tab 切换 */
    var descEl=document.getElementById('scenDesc');
    function refreshDesc(){ if(descEl)descEl.textContent=SCEN_DESC[SCEN]||''; }
    refreshDesc();
    b.querySelectorAll('.scen-tab').forEach(function(t){
      t.onclick=function(){ SCEN=t.getAttribute('data-scen');
        b.querySelectorAll('.scen-tab').forEach(function(x){x.classList.remove('sel');});
        t.classList.add('sel'); refreshDesc();
      };
    });
    /* 剔除逻辑 chip */
    var excludeGroup=b.querySelector('.rule-exclude div');
    if(excludeGroup)excludeGroup.querySelectorAll('.rb-opt').forEach(function(o){ o.onclick=function(){ o.classList.toggle('sel'); }; });
    /* 仿真对比 */
    var sim=document.getElementById('ruleSim');
    if(sim)sim.onclick=function(){ renderSimCompare(); };
    var rs=document.getElementById('ruleReset');
    if(rs)rs.onclick=function(){ SCEN='hit'; openStrategy(); setTimeout(function(){ document.getElementById('enterCfg').click(); },50); };
    var back=document.getElementById('backOverview');
    if(back)back.onclick=function(){ openStrategy(); };
  }
  function renderSimCompare(){
    var host=document.getElementById('simCompareHost'); if(!host)return;
    var data={
      hit:    { cur:['459 个','86 家','12 个','316 万'], nw:['512 个','94 家','13 个','362 万'], keys:['命中 SKU 数','涉及供应商数','涉及部门数','预估节降金额'] },
      benefit:{ cur:['316 万','-6.4%','+2.8pt','-1.5pt'], nw:['362 万','-7.1%','+3.2pt','-1.7pt'], keys:['预估节降金额','预计采购价降幅','预计前毛率提升','预计返利占比降低'] },
      change: { cur:['—','—','—','—'],           nw:['+68 个','15 个','—','—'],         keys:['新增命中 SKU','释放 SKU','净变化','命中率变化'] },
      query:  { cur:['459 个','3,860 万','42.6 万件','86 家'], nw:['512 个','4,240 万','48.2 万件','94 家'], keys:['SKU 数','近30天销售额','30天预估采购量','供应商数'] }
    };
    var d=data[SCEN]||data.hit;
    var cur=d.keys.map(function(k,i){ return '<div class="sim-metric"><span class="sm-l">'+k+'</span><span class="sm-v">'+d.cur[i]+'</span></div>'; }).join('');
    var nw=d.keys.map(function(k,i){
      var upDown='';
      var m1=parseFloat((d.cur[i]||'').replace(/[^\-\d\.]/g,''));
      var m2=parseFloat((d.nw[i]||'').replace(/[^\-\d\.]/g,''));
      if(!isNaN(m1)&&!isNaN(m2)&&m1!==m2) upDown=' '+(m2>m1?'up':'down');
      return '<div class="sim-metric"><span class="sm-l">'+k+'</span><span class="sm-v'+upDown+'">'+d.nw[i]+'</span></div>';
    }).join('');
    host.innerHTML=''
    +'<div class="strat-h">&#128260; 仿真对比 · '+({hit:'规则命中测算',benefit:'效果测算',change:'规则变更影响测算',query:'数据查询'}[SCEN])+'</div>'
    +'<div class="sim-compare">'
    +'  <div class="sim-col cur"><div class="sc-title">生效中策略 <span class="sc-tag">CURRENT</span></div>'+cur+'</div>'
    +'  <div class="sim-col new"><div class="sc-title">本次策略 <span class="sc-tag">SIMULATED</span></div>'+nw+'</div>'
    +'</div>'
    +'<div style="margin-top:12px;font-size:12px;color:#8a9099;">对比结论：本次策略较生效中策略命中量级更大，可覆盖更多改善空间。建议先在部分品类灰度后再全量下发。</div>';
    if(typeof addAI==='function')addAI('已完成「'+({hit:'规则命中测算',benefit:'效果测算',change:'规则变更影响测算',query:'数据查询'}[SCEN])+'」仿真对比。可切到「改善进度 & 明细」查看命中商品清单，或直接说「下发本次策略」执行落地。');
  }
})();
</script>
